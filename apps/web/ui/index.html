<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/brand/logo-mark.png" />
    <title>审稿台</title>
    <style>
      html, body { margin: 0; background: #f8f5fa; color: #1c1a1f;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif; }
      .boot { margin: 0; padding: 48px 28px; font-size: 16px; color: #6b6572; }
    </style>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("wb_appearance");
          if (!raw) return;
          var o = JSON.parse(raw);
          var theme = o && o.theme;
          var dark =
            theme === "dark" ||
            (theme === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.setAttribute("data-theme", "dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"><p class="boot">打开审稿台…</p></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
