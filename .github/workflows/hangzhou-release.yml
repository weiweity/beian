# Hangzhou Windows production only.
# Does not checkout into Actions _work: release.ps1 runs against D:\beian.
# Does not start or stop cloudflared. Does not kill all node.exe.
name: hangzhou-release

on:
  push:
    branches: [main]

concurrency:
  group: hangzhou-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, hangzhou]
    timeout-minutes: 40
    env:
      WB_DATA_DIR: C:\supply\data
      WB_PUBLIC: "1"
      WB_DEV_DISPLAY_LOGIN: "false"
      WB_PYTHON: D:\beian\apps\web\backend\.venv\Scripts\python.exe
      GIT_TERMINAL_PROMPT: "0"
      # The first trusted main push fails closed on legacy 0.19. After the
      # approved maintenance stop, only "Re-run failed jobs" for that same
      # immutable push SHA may authorize the one-time 0.20 bootstrap.
      ALLOW_LEGACY_OFFLINE_BOOTSTRAP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt > 1 && 'true' || 'false' }}
    steps:
      - name: Drain, pull, build, restart :8787
        # cmd wrapper: Actions powershell shell dotsources a temp .ps1 under the
        # runner execution policy. Hangzhou Restricted blocked that (0.12.3.0 land,
        # 1s red) before release.ps1 could Bypass.
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rem Download the exact event commit's CD components to RUNNER_TEMP via GitHub API.
          rem Bootstrap must not checkout/reset D:\beian before release.ps1 owns a journal.
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; $dir=Join-Path $env:RUNNER_TEMP ('beian-release-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT); $headers=@{ Authorization=('Bearer ' + $env:GITHUB_TOKEN); Accept='application/vnd.github.raw+json'; 'X-GitHub-Api-Version'='2022-11-28' }; $files=@('release.ps1','release-recover.ps1','install-illustrator-agent.ps1','release-dependency-check.mjs'); $code=1; try { New-Item -ItemType Directory -Force -Path $dir | Out-Null; foreach ($name in $files) { $uri=('https://api.github.com/repos/' + $env:GITHUB_REPOSITORY + '/contents/scripts/windows/' + $name + '?ref=' + [Uri]::EscapeDataString($env:GITHUB_SHA)); Invoke-WebRequest -UseBasicParsing -Headers $headers -Uri $uri -OutFile (Join-Path $dir $name) }; $engine=Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'; $arguments=@('-NoProfile','-ExecutionPolicy','Bypass','-File',(Join-Path $dir 'release.ps1'),'-RepositoryRoot','D:\beian','-ReleaseSourceDir',$dir,'-TargetSha',$env:GITHUB_SHA); if ($env:ALLOW_LEGACY_OFFLINE_BOOTSTRAP -eq 'true') { $arguments += '-AllowLegacyOfflineBootstrap' }; & $engine @arguments; $code=$LASTEXITCODE } finally { Remove-Item -LiteralPath $dir -Recurse -Force -ErrorAction SilentlyContinue }; exit $code"
      - name: Start last 8787 if release died after stop
        if: failure()
        shell: cmd
        run: |
          rem If release.ps1 died after arming, use the journal-bound rollback first.
          if exist C:\supply\data\runtime\release\release-journal.json (
            if not exist C:\supply\data\runtime\release\release-recover.ps1 exit /b 1
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\supply\data\runtime\release\release-recover.ps1 -JournalPath C:\supply\data\runtime\release\release-journal.json -TaskName beian-release-watchdog -Force
            if errorlevel 1 exit /b 1
          )
          rem No armed transaction remains. Do not touch cloudflared or kill node.exe.
          rem WinSW service is outside the Actions job tree.
          sc query beian-server-8787 | find "RUNNING" >nul
          if not errorlevel 1 exit /b 0
          sc start beian-server-8787
          rem 1056 = ERROR_SERVICE_ALREADY_RUNNING; treat as success.
          if errorlevel 1 (
            sc query beian-server-8787 | find "RUNNING" >nul
            if errorlevel 1 exit /b 1
          )
          exit /b 0
