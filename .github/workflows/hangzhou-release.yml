# Hangzhou Windows production only.
# Does not checkout into Actions _work: release.ps1 runs against D:\beian.
# Does not start or stop cloudflared. Does not kill all node.exe.
name: hangzhou-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hangzhou-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: [self-hosted, hangzhou]
    timeout-minutes: 40
    env:
      WB_DATA_DIR: C:\supply\data
      WB_PUBLIC: "1"
      WB_DEV_DISPLAY_LOGIN: "false"
      WB_PYTHON: D:\beian\apps\web\backend\.venv\Scripts\python.exe
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Drain, pull, build, restart :8787
        # cmd wrapper: Actions powershell shell dotsources a temp .ps1 under the
        # runner execution policy. Hangzhou Restricted blocked that (0.12.3.0 land,
        # 1s red) before release.ps1 could Bypass.
        shell: cmd
        run: |
          rem On-disk script lags origin until pull. Drop npm-dirty lockfile first.
          git -C D:\beian checkout -- package-lock.json
          if errorlevel 1 exit /b 1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File D:\beian\scripts\windows\release.ps1
      - name: Start last 8787 if release died after stop
        if: failure()
        shell: cmd
        run: |
          rem Job killed or script threw after :8787 was stopped. Do not touch cloudflared.
          rem Do not kill node.exe. Extra /Run while 8787 is up fails bind and exits.
          schtasks /Run /TN beian-server-8787
