name: quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full history for baseline comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/quality/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/web/backend/requirements.txt
            apps/web/backend/requirements-quality.txt

      - name: Install Node dependencies
        run: |
          npm ci
          npm ci --prefix tools/quality

      - name: Install Python and quality dependencies
        run: |
          python -m venv apps/web/backend/.venv
          apps/web/backend/.venv/bin/python -m pip install --disable-pip-version-check \
            -r apps/web/backend/requirements.txt \
            -r apps/web/backend/requirements-quality.txt

      - name: Test quality contracts
        run: npm run test:quality

      - name: Enforce monotonic quality baseline
        if: github.event_name == 'pull_request'
        run: npm run quality -- --base-ref "${{ github.event.pull_request.base.sha }}"

      - name: Run quality checks
        if: github.event_name != 'pull_request'
        run: npm run quality

      - name: Run strict type and UI build checks
        run: npm run typecheck

      - name: Run complete L0 suite
        run: npm test
